services:
  webmail:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${HOST_PORT:-8087}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
